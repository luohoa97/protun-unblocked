[package]
name = "pvpn-gui"
version = "0.1.0"
edition = "2021"
description = "libadwaita front-end for pvpn"
license = "GPL-3.0-or-later"

[dependencies]
gtk = { package = "gtk4", version = "0.9" }
adw = { package = "libadwaita", version = "0.7", features = ["v1_5"] }
async-channel = "2"
serde_json = "1"

[profile.release]
opt-level = "s"
strip = true
