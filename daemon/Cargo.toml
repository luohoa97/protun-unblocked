[package]
name = "pvpnd"
version = "0.1.0"
edition = "2021"
description = "Keeps a Proton VPN tunnel alive, and repairs it when it dies"
license = "GPL-3.0-or-later"

# No dependencies on purpose. This runs continuously in the background on a
# machine whose whole point is privacy, so the supply chain is kept at zero
# and the binary at a few hundred KB. The daemon drives `pvpn`, which
# already holds every hard-won behaviour; it does not reimplement it.

[profile.release]
opt-level = "s"
strip = true
